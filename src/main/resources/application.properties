# ============================================================================
#  application.properties
#  User Authentication Web Application - Spring Boot 4.1
#
#  Every sensitive value is read from an environment variable via the
#  ${VAR_NAME} / ${VAR_NAME:default} placeholder syntax. See .env.example.
# ============================================================================


# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
spring.application.name=auth-app
server.port=8081


# ---------------------------------------------------------------------------
# Datasource - MySQL
#   Defaults are only for the non-secret parts (host, port, DB name, user).
#   DB_PASSWORD has NO default: startup fails clearly if it is not provided.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_app_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ---------------------------------------------------------------------------
# JPA / Hibernate
#   ddl-auto=validate : Hibernate verifies the entity matches the existing
#                       table but never modifies the schema. Schema lives in
#                       database/schema.sql, which you run manually.
#   open-in-view=false: closes the persistence context at controller
#                       boundary; avoids surprise lazy-loads and N+1 queries.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


# ---------------------------------------------------------------------------
# JWT
#   JWT_SECRET     : REQUIRED, no default. Must be a Base64-encoded string
#                    that decodes to at least 32 bytes (HS256 minimum).
#   JWT_EXPIRATION : Access-token lifetime in ms. Default = 3,600,000 ms = 1 h.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}


# ---------------------------------------------------------------------------
# CORS
#   Allowed frontend origin(s), comma-separated.
#   Default = the Vite dev server on http://localhost:5173.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# ---------------------------------------------------------------------------
# Jackson (JSON)
#   Drop null fields from responses.
# ---------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.com.example.authapp=DEBUG
