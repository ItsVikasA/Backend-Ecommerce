services:
  - type: web
    name: auth-app-backend
    runtime: java
    region: oregon
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: java -Dspring.profiles.active=prod -jar target/auth-app-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: CORS_ORIGINS
        sync: false
